name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      # Includes collecting the real inventory of the runner, so each OS's
      # collectors (PowerShell/CIM, sysctl/sw_vers, /proc) run for real.
      - run: go test -v ./...
      - name: The binary runs
        shell: bash
        run: |
          go build -o seredina-agent-test .
          ./seredina-agent-test version
          ./seredina-agent-test status --config-dir "$RUNNER_TEMP/none"

  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/build.sh ci
      - run: sh -n scripts/install.sh
