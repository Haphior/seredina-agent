name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      # Includes collecting the real inventory of the runner, so each OS's
      # collectors (PowerShell/CIM, sysctl/sw_vers, /proc) run for real.
      - run: go test -v ./...
      - name: The binary runs
        shell: bash
        run: |
          go build -o seredina-agent-test .
          ./seredina-agent-test version
          ./seredina-agent-test status --config-dir "$RUNNER_TEMP/none"
      # The real inventory of each runner, collected as administrator/root
      # like the service does, so reviewers can see every collector's output.
      - name: Full inventory of this runner
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          out="$RUNNER_TEMP/inventory.json"
          if [ "$RUNNER_OS" = Windows ]; then
            ./seredina-agent-test inventory --out "$out"
            python scripts/inventory-summary.py "$out"
          else
            sudo ./seredina-agent-test inventory --out "$out"
            sudo chmod 644 "$out"
            python3 scripts/inventory-summary.py "$out"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: inventory-${{ matrix.os }}
          path: ${{ runner.temp }}/inventory.json

  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/build.sh ci
      - run: sh -n scripts/install.sh
