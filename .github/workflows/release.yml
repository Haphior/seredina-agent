name: Release

# Publishes six archives (Windows, macOS, Linux on amd64/arm64), SHA256SUMS
# and the install scripts on a GitHub release. Either push a tag like v0.1.0,
# or run this workflow by hand with the version: it then creates the tag on
# the commit it runs on.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          echo "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "not a version: $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: go test ./...
      - name: Build
        run: scripts/build.sh "$VERSION"
      # Code signing goes here once certificates exist: sign the Windows .exe
      # (signtool, from a secret-held certificate) and sign + notarize the
      # macOS binaries (codesign + notarytool, on a macos runner) before
      # scripts/build.sh archives them. Until then releases are unsigned.
      - name: Add the install scripts
        run: cp scripts/install.sh scripts/install.ps1 dist/
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          # A pushed tag already exists; a manual run creates it on this commit.
          gh release create "$VERSION" dist/* --target "$GITHUB_SHA" --generate-notes $prerelease \
            --title "Seredina agent $VERSION"
